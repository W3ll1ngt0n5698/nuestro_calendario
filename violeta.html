<!doctype html>
<html lang="es"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Nuestro calendario</title>
<meta name="theme-color" content="#C92A5B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Calendario">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icons/icon-violeta-180.png">
<link rel="icon" type="image/png" href="icons/icon-violeta-192.png">
<link rel="manifest" href="manifest-violeta.json">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="config.js"></script>
<script>window.DEFAULT_ACCENT="violeta";</script>
</head><body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Nunito:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600;700&family=Lora:wght@400;500;600;700&family=Caveat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Concepto: una agenda de bolsillo para dos. Cabecera con foto y nombres, mensaje del dia,
   y tres pestañas: calendario con cuentas atras, lista de cosas por hacer y cartas con fecha.
   Los datos viven en una base compartida: lo que cambia uno lo ve el otro al momento. */
:root{
  --bg:#FBF2F4;
  --surface:#FFFFFF;
  --ink:#2B1F33;
  --muted:#6F5F78;
  --line:#EBD8DE;
  --rose:#C92A5B;
  --rose-soft:#FBDDE6;
  --gold:#8F5A0C;
  --gold-soft:#FBEBC9;
  --sage:#1F7A62;
  --sage-soft:#D3EEE4;
  --on-rose:#FFFFFF;
  --scrim:rgba(30,16,36,.45);
  --font-display:'Lora',Georgia,'Times New Roman',serif;
  --font-body:'Lora',Georgia,'Times New Roman',serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1B1423;--surface:#271D31;--ink:#F7EAEF;--muted:#B8A7C0;--line:#3B2C48;
    --rose:#F2698F;--rose-soft:#4B2434;--gold:#F0BE63;--gold-soft:#4A3A1B;
    --sage:#6FCDB0;--sage-soft:#1D4036;--on-rose:#2B0F19;--scrim:rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1B1423;--surface:#271D31;--ink:#F7EAEF;--muted:#B8A7C0;--line:#3B2C48;
  --rose:#F2698F;--rose-soft:#4B2434;--gold:#F0BE63;--gold-soft:#4A3A1B;
  --sage:#6FCDB0;--sage-soft:#1D4036;--on-rose:#2B0F19;--scrim:rgba(0,0,0,.6);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font:400 16px/1.45 var(--font-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent;
}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--rose);outline-offset:2px}
.t-imp{--tc:var(--gold);--ts:var(--gold-soft)}
.t-sal{--tc:var(--rose);--ts:var(--rose-soft)}
.t-plan{--tc:var(--sage);--ts:var(--sage-soft)}
svg.i{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.app{max-width:520px;margin:0 auto;padding-block:22px 120px;display:flex;flex-direction:column;gap:22px}

/* Cabecera */
.head{display:flex;align-items:center;gap:10px}
.avwrap{position:relative;flex:none}
.avatar{
  width:72px;height:72px;border-radius:50%;border:3px solid var(--rose);background:var(--rose-soft);
  padding:0;overflow:hidden;display:grid;place-items:center;color:var(--rose);
}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.avatar svg.i{width:34px;height:34px;fill:var(--rose);stroke:none}
.avatar.big{width:96px;height:96px}
.badge{
  position:absolute;right:-2px;bottom:-2px;width:28px;height:28px;border-radius:50%;
  background:var(--rose);color:var(--on-rose);border:2px solid var(--bg);display:grid;place-items:center;pointer-events:none;
}
.badge svg.i{width:14px;height:14px}
.head-t{min-width:0;flex:1}
.head-t h1{font:400 26px/1.1 var(--font-display);margin:0;overflow-wrap:break-word;word-break:normal;hyphens:auto;text-wrap:balance}
.head-t p{margin:6px 0 0;color:var(--muted);font-size:14px}
.nav{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;padding:0;flex:none;color:var(--ink)}
.nav svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* Estado de la conexion */
.status:empty{display:none}
.pill{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600;padding:6px 12px;border-radius:16px;background:var(--surface);border:1px solid var(--line);color:var(--muted)}
.pill i{flex:none;width:8px;height:8px;border-radius:50%;background:var(--sage)}
.pill.warn{color:var(--ink);background:var(--gold-soft);border-color:transparent}
.pill.warn i{background:var(--gold)}
.pill.wait i{background:var(--muted)}

/* Mensaje del dia */
.daily{background:var(--rose-soft);border-radius:20px;padding:16px 18px}
.daily .k{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.daily p{margin:6px 0 0;font:400 21px/1.3 var(--font-display);text-wrap:pretty;overflow-wrap:anywhere}

/* Pestañas */
.tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;padding:4px;background:var(--surface);border:1px solid var(--line);border-radius:16px}
.tabs button{
  position:relative;border:0;background:transparent;border-radius:12px;padding:10px 4px;min-height:44px;
  font-weight:600;color:var(--muted);
}
.tabs button[aria-selected="true"]{background:var(--rose);color:var(--on-rose)}
.pip{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--gold);margin-left:6px;vertical-align:1px;border:2px solid var(--surface)}
.panel{display:flex;flex-direction:column;gap:22px}

/* Calendario */
.since{
  display:flex;align-items:center;justify-content:space-between;gap:16px;width:100%;text-align:left;
  background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px 18px;min-width:0;
}
.s-l{display:flex;flex-direction:column;gap:2px;min-width:0}
.s-k{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.s-v{font-weight:600;text-wrap:balance}
.s-n{font:400 40px/1 var(--font-display);color:var(--rose);display:flex;flex-direction:column;align-items:flex-end;font-variant-numeric:tabular-nums}
.s-n small{font:600 12px/1.2 var(--font-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.s-plus{font-size:34px}

.mhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.mhead h2{margin:0;font:400 26px/1.1 var(--font-display);text-transform:capitalize;text-align:center;flex:1}
.mhead h2 span{color:var(--muted)}
.dow,.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.dow span{text-align:center;font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--muted);padding:6px 0}
.day{
  min-width:0;min-height:58px;border:1px solid transparent;border-radius:14px;background:transparent;
  display:flex;flex-direction:column;align-items:center;gap:5px;padding:7px 0 6px;
  font-variant-numeric:tabular-nums;
}
.day.has{background:var(--surface);border-color:var(--line)}
.day .n{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:500}
.day.today .n{background:var(--rose);color:var(--on-rose);font-weight:700}
.dots{display:flex;gap:3px;height:6px}
.dot{width:6px;height:6px;border-radius:50%;background:var(--tc)}

.sec h3,.panel h3{margin:0 0 12px;font:400 24px/1.1 var(--font-display)}
.lead{margin:-6px 0 12px;color:var(--muted);font-size:14px}
.list{display:flex;flex-direction:column;gap:10px}
.ev{
  display:flex;align-items:center;gap:14px;width:100%;text-align:left;min-width:0;
  background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px 14px 10px 10px;
}
.when{
  flex:none;width:54px;height:56px;border-radius:12px;background:var(--ts);color:var(--tc);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
}
.when b{font:400 24px/1 var(--font-display);font-variant-numeric:tabular-nums}
.when i{font-style:normal;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.ev-t{min-width:0;display:flex;flex-direction:column;gap:2px}
.ev-t strong{font-weight:600;overflow-wrap:anywhere}
.ev-t span{font-size:14px;color:var(--muted)}
.empty{margin:0;padding:18px;border:1px dashed var(--line);border-radius:16px;color:var(--muted)}
.note-box{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;
  padding:14px 16px;border-radius:16px;background:var(--gold-soft);color:var(--ink)}
.note-box p{margin:0;flex:1 1 200px;font-size:14px}

/* Cuenta atras */
.cd-list{display:flex;flex-direction:column;gap:10px}
.cd{
  display:flex;align-items:center;gap:16px;width:100%;text-align:left;min-width:0;
  background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:14px 16px;
}
.cd-n{flex:none;min-width:76px;display:flex;flex-direction:column;align-items:center;color:var(--tc)}
.cd-n b{font:400 50px/1 var(--font-display);font-variant-numeric:tabular-nums}
.cd-n b.hoy{font-size:34px;line-height:50px}
.cd-n small{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.cd-t{min-width:0;display:flex;flex-direction:column;gap:2px}
.cd-t strong{font-weight:600;overflow-wrap:anywhere}
.cd-t span{font-size:14px;color:var(--muted)}

/* Lista por hacer */
.add{display:flex;gap:8px}
.add input{flex:1;min-width:0;margin-top:0}
.add .btn{flex:none;padding:0 18px}
.prog{display:flex;justify-content:space-between;gap:8px;font-size:14px;color:var(--muted);margin:0 0 6px}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--sage);border-radius:4px}
.todo{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:8px;min-width:0}
.tick{flex:none;width:44px;height:44px;border-radius:50%;border:2px solid var(--muted);background:transparent;display:grid;place-items:center;padding:0;color:var(--on-rose)}
.tick svg{width:22px;height:22px;stroke-width:3;opacity:0}
.tick[aria-pressed="true"]{background:var(--sage);border-color:var(--sage)}
.tick[aria-pressed="true"] svg{opacity:1}
.todo-t{flex:1;min-width:0;display:flex;flex-direction:column}
.todo-t span{overflow-wrap:anywhere}
.todo-t small{color:var(--muted);font-size:13px}
.todo.done .todo-t span{text-decoration:line-through;color:var(--muted)}
.xb{flex:none;width:44px;height:44px;border-radius:50%;border:0;background:transparent;color:var(--muted);display:grid;place-items:center;padding:0}
.xb svg{width:20px;height:20px}
.todo .conf{display:flex;gap:6px;flex:none}

/* Cartas */
.letters{display:flex;flex-direction:column;gap:10px}
.letter{
  display:flex;align-items:center;gap:14px;width:100%;text-align:left;min-width:0;
  background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;
}
.letter.open{--tc:var(--rose);--ts:var(--rose-soft)}
.letter.locked{--tc:var(--muted);--ts:var(--line);border-style:dashed}
.letter .ic{flex:none;width:52px;height:52px;border-radius:14px;background:var(--ts);color:var(--tc);display:grid;place-items:center}
.letter-t{min-width:0;display:flex;flex-direction:column;gap:3px}
.letter-t strong{font-weight:600;overflow-wrap:anywhere}
.letter-t span{font-size:14px;color:var(--muted)}
.paper{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;margin-top:6px}
.paper p{margin:0 0 14px;font-size:17px;line-height:1.6;text-wrap:pretty;overflow-wrap:anywhere}
.paper p:last-child{margin-bottom:0}

.foot{text-align:center;color:var(--muted);font-size:14px;margin:0}
.heart{display:inline-block;width:14px;height:14px;fill:var(--rose);vertical-align:-1px}

.fab{
  position:fixed;z-index:5;
  right:calc(max(16px,env(safe-area-inset-right,0px)));
  bottom:calc(18px + env(safe-area-inset-bottom,0px));
  width:60px;height:60px;border-radius:50%;border:0;background:var(--rose);color:var(--on-rose);
  display:grid;place-items:center;box-shadow:0 8px 22px rgba(120,20,55,.35);padding:0;
}
.fab svg{width:26px;height:26px;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;fill:none}

.scrim{position:fixed;inset:0;background:var(--scrim);z-index:10;border:0;padding:0;width:100%}
.sheet{
  position:fixed;z-index:11;left:0;right:0;bottom:0;margin:0 auto;width:100%;max-width:560px;
  max-height:88%;overflow-y:auto;overscroll-behavior:contain;
  background:var(--bg);border-radius:26px 26px 0 0;border:1px solid var(--line);border-bottom:0;
  padding:12px max(18px,env(safe-area-inset-left,0px)) calc(22px + env(safe-area-inset-bottom,0px));
  animation:up .22s ease-out;
}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion: reduce){.sheet{animation:none}}
.grab{width:42px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}
.sheet h4{margin:0 0 4px;font:400 26px/1.1 var(--font-display);outline:none;overflow-wrap:anywhere}
.sheet h4.cap{text-transform:capitalize}
.sheet .sub{margin:0 0 14px;color:var(--muted);font-size:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.btn{border:0;border-radius:14px;padding:14px 18px;font-weight:600;min-height:48px;flex:1 1 auto}
.btn.main{background:var(--rose);color:var(--on-rose)}
.btn.soft{background:var(--surface);border:1px solid var(--line)}
.btn.danger{background:var(--surface);border:1px solid var(--rose);color:var(--rose)}
label.btn{margin:0;display:grid;place-items:center;text-transform:none;letter-spacing:0;font-size:16px;font-weight:600;color:var(--ink);cursor:pointer}
.mini{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;font-size:14px;font-weight:600;min-height:40px}
.mini.danger{color:var(--rose);border-color:var(--rose)}
.item{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:10px}
.chip{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  padding:3px 9px;border-radius:999px;background:var(--ts);color:var(--tc)}
.chip.ex{--tc:var(--gold);--ts:var(--gold-soft)}
.item h5{margin:8px 0 2px;font-size:17px;font-weight:600;overflow-wrap:anywhere}
.item p{margin:2px 0 0;color:var(--muted);font-size:14px;overflow-wrap:anywhere}
.item .row{margin-top:12px}
.item .row .mini{flex:0 0 auto}
label{display:block;margin-top:14px;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
input[type=text],input[type=password],input[type=date],input[type=time],textarea{
  width:100%;margin-top:6px;padding:12px;font-size:16px;border-radius:12px;
  border:1px solid var(--line);background:var(--surface);color:var(--ink);min-height:48px;
}
textarea{resize:vertical;min-height:76px}
.types{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:6px}
.types button{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 6px;font-size:14px;font-weight:600;min-height:48px}
.types button[aria-pressed="true"]{background:var(--ts);color:var(--tc);border-color:var(--tc)}
.check{display:flex;align-items:center;gap:10px;margin-top:16px;text-transform:none;letter-spacing:0;font-size:16px;font-weight:500;color:var(--ink)}
.check input{width:22px;height:22px;accent-color:var(--rose);margin:0;flex:none}
.err{color:var(--rose);font-weight:600;min-height:22px;margin:10px 0 0;font-size:14px}
.pv-row{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-top:8px}
.pv-btns{display:flex;flex-direction:column;gap:8px;flex:1 1 150px;min-width:0}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}
.write-btn{width:100%;flex:none}
.pin-in{letter-spacing:.5em;text-align:center;font-size:24px;font-variant-numeric:tabular-nums}
.help{margin:6px 0 0;font-size:13px;color:var(--muted)}
.letter.mine{--tc:var(--sage);--ts:var(--sage-soft)}
.letter-t .mini{align-self:flex-start;margin-top:6px}
textarea.big{min-height:200px}

.login{position:fixed;inset:0;z-index:50;background:var(--bg);display:grid;place-items:center;padding:24px}
.login-box{width:100%;max-width:380px;text-align:center}
.login-box img{width:96px;height:96px;border-radius:22px;box-shadow:0 8px 22px rgba(120,20,55,.25)}
.login-box h2{font:400 32px/1.1 var(--font-display);margin:16px 0 6px}
.login-box p{color:var(--muted);margin:0 0 6px}
.login-box form{text-align:left}
.login-box .btn{width:100%;margin-top:18px}

/* ===== Movimiento y respuesta al tocar ===== */
button,.btn,label.btn,.day,.ev,.cd,.since,.letter,.mini,.tick,.xb,.nav,.fab,.avatar,.types button{
  transition:transform .16s cubic-bezier(.2,.8,.2,1),background-color .2s ease,border-color .2s ease,color .2s ease,box-shadow .2s ease,opacity .2s ease;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;
}
.btn:active,.mini:active,.nav:active,.avatar:active,.types button:active,.xb:active{transform:scale(.93)}
.day:active,.ev:active,.cd:active,.since:active,.letter:active,.tabs button:active{transform:scale(.97)}
.tick:active{transform:scale(.85)}
.fab:active{transform:scale(.88) rotate(90deg);box-shadow:0 3px 10px rgba(120,20,55,.3)}
.fab{transition:transform .25s cubic-bezier(.34,1.56,.64,1),box-shadow .2s ease}
.btn.main:active{filter:brightness(.92)}
.day .n{transition:transform .2s cubic-bezier(.34,1.56,.64,1),background-color .2s}
.day:active .n{transform:scale(1.18)}
.tabs button{transition:background-color .25s ease,color .25s ease,transform .16s ease}
.tick svg{transition:opacity .15s ease,transform .3s cubic-bezier(.34,1.56,.64,1);transform:scale(.4)}
.tick[aria-pressed="true"] svg{transform:scale(1)}
.tick.pop{animation:tickpop .45s cubic-bezier(.34,1.56,.64,1)}
@keyframes tickpop{0%{transform:scale(.7)}55%{transform:scale(1.22)}100%{transform:scale(1)}}
.bar i{transition:width .5s cubic-bezier(.2,.8,.2,1)}
.panel{animation:fadein .28s ease-out}
@keyframes fadein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.scrim{animation:scrimin .22s ease-out}
@keyframes scrimin{from{opacity:0}to{opacity:1}}
.sheet{animation:sheetin .38s cubic-bezier(.32,1.2,.4,1)}
@keyframes sheetin{from{transform:translateY(60px);opacity:0}to{transform:none;opacity:1}}
.pill{animation:fadein .3s ease-out}
.heart-beat{animation:beat .6s ease-out}
@keyframes beat{0%{transform:scale(1)}30%{transform:scale(1.35)}60%{transform:scale(.95)}100%{transform:scale(1)}}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}

/* ===== Cristal liquido (se puede quitar en Ajustes) ===== */
.swatches{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:8px}
.sw{height:48px;border-radius:14px;border:2px solid transparent;padding:0;position:relative}
.sw[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 3px var(--bg) inset}
.sw span{position:absolute;left:50%;top:50%;width:18px;height:18px;margin:-9px;color:#fff;opacity:0}
.sw[aria-pressed="true"] span{opacity:1}
.fonts{display:flex;flex-direction:column;gap:8px;margin-top:8px}

<script>
(function(){
var MONTHS=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
var MON_S=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
var WD=['lunes','martes','miércoles','jueves','viernes','sábado','domingo'];
var TYPES={
  importante:{label:'Fecha importante',short:'Importante',cls:'t-imp'},
  salida:{label:'Salida',short:'Salida',cls:'t-sal'},
  plan:{label:'Plan o cita',short:'Plan',cls:'t-plan'}
};
var KEY='nuestro-calendario-v1';
var PHOTO_KEY='nuestro-calendario-foto';
var READ_KEY='nuestro-calendario-leidas';
var UNLOCK_KEY='nuestro-calendario-abiertas';
var mem=null,memPhoto=null,memRead=null,memUnlock=null;

/* ===== Contenido para personalizar =====
   PAREJA: nombres y foto por defecto, si todavia no se han puesto en la app.
   MENSAJES: uno por dia, van rotando.
   Las cartas ya no van aqui: se escriben dentro de la app y se guardan en la base compartida. */
var PAREJA={a:'',b:'',foto:''};
var MENSAJES=[
  'Hoy me acuerdo de ti más de lo normal, y eso ya es decir mucho.',
  'Contigo hasta los planes más sencillos se convierten en los mejores.',
  'Gracias por hacer que los días normales valgan la pena.',
  'Si hoy el día se pone difícil, acuérdate de que estoy de tu lado.',
  'Tengo ganas de verte y de no hacer nada importante a tu lado.',
  'Eres mi parte favorita del día.',
  'Lo mejor de mi semana siempre lleva tu risa dentro.'
];
var HEART='<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21l-1.4-1.3C5.4 15 2 11.9 2 8.1 2 5 4.4 2.6 7.5 2.6c1.7 0 3.4.8 4.5 2.1 1.1-1.3 2.8-2.1 4.5-2.1 3.1 0 5.5 2.4 5.5 5.5 0 3.8-3.4 6.9-8.6 11.6z"/></svg>';
var PENCIL='<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16v4z"/></svg>';
var LOCK='<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>';
var MAIL='<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>';
var CHECK='<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
var CROSS='<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>';

function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function p2(n){return (n<10?'0':'')+n;}
function ymd(y,m0,d){return y+'-'+p2(m0+1)+'-'+p2(d);}
function parse(s){var a=s.split('-').map(Number);return {y:a[0],m:a[1]-1,d:a[2]};}
function todayDate(){var n=new Date();return new Date(n.getFullYear(),n.getMonth(),n.getDate());}
function dateOf(s){var p=parse(s);return new Date(p.y,p.m,p.d);}
function diffDays(a,b){return Math.round((Date.UTC(b.getFullYear(),b.getMonth(),b.getDate())-Date.UTC(a.getFullYear(),a.getMonth(),a.getDate()))/864e5);}
function wdName(dt){return WD[(dt.getDay()+6)%7];}
function uid(){return 'e'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function fmtLong(s){var p=parse(s);return p.d+' de '+MONTHS[p.m]+' de '+p.y;}
function fmtShort(s){var p=parse(s);return p.d+' '+MON_S[p.m]+(p.y!==new Date().getFullYear()?' '+p.y:'');}
function ymdOf(dt){return ymd(dt.getFullYear(),dt.getMonth(),dt.getDate());}

/* ===== Guardado local (solo si no hay base compartida) ===== */
function load(){
  try{var r=localStorage.getItem(KEY);if(r){return JSON.parse(r);}}catch(e){}
  return mem;
}
function save(){
  var data={events:state.events,since:state.since,todos:state.todos,names:state.names};
  mem=data;
  try{localStorage.setItem(KEY,JSON.stringify(data));}catch(e){}
}
function loadPhoto(){
  var v=null;
  try{v=localStorage.getItem(PHOTO_KEY);}catch(e){v=memPhoto;}
  if(v===null||v===undefined){return PAREJA.foto||'';}
  return v==='none'?'':v;
}
function savePhoto(p){
  memPhoto=p||'none';
  try{localStorage.setItem(PHOTO_KEY,p||'none');return true;}catch(e){return false;}
}
function loadRead(){
  try{var r=localStorage.getItem(READ_KEY);if(r){return JSON.parse(r)||{};}}catch(e){}
  return memRead||{};
}
function saveRead(){
  memRead=state.read;
  try{localStorage.setItem(READ_KEY,JSON.stringify(state.read));}catch(e){}
}
function loadUnlocked(){
  try{var r=localStorage.getItem(UNLOCK_KEY);if(r){return JSON.parse(r)||{};}}catch(e){}
  return memUnlock||{};
}
function saveUnlocked(){
  memUnlock=state.unlocked;
  try{localStorage.setItem(UNLOCK_KEY,JSON.stringify(state.unlocked));}catch(e){}
}

function seedEvents(){
  var t=todayDate();
  function plus(n){return ymdOf(new Date(t.getFullYear(),t.getMonth(),t.getDate()+n));}
  return [
    {id:uid(),title:'Cena en el sitio que queremos probar',date:plus(3),time:'21:00',type:'salida',note:'Ejemplo: bórralo o cámbialo cuando quieras.',yearly:false,countdown:true,example:true},
    {id:uid(),title:'Cine y paseo después',date:plus(8),time:'18:30',type:'plan',note:'',yearly:false,countdown:false,example:true},
    {id:uid(),title:'Aniversario',date:plus(21),time:'',type:'importante',note:'Ejemplo: se repite todos los años.',yearly:true,countdown:true,example:true}
  ];
}
function seedTodos(){
  return ['Ver el atardecer desde un mirador','Probar un restaurante nuevo','Hacer una escapada de fin de semana','Montar un puzle juntos','Cocinar algo que nunca hayamos hecho']
    .map(function(t){return {id:uid(),text:t,done:false,doneOn:'',example:true};});
}

var now=todayDate();
var state={
  mode:'boot',      /* boot | local | cloud */
  db:null,loaded:false,slow:false,readOnly:false,notice:'',
  events:[],since:'',todos:[],
  names:{a:PAREJA.a,b:PAREJA.b},
  photo:PAREJA.foto||'',
  read:loadRead(),
  unlocked:loadUnlocked(),
  me:null,meKnown:false,user:null,
  cartas:[],authorNames:{},pinTry:{n:0,until:0},confirmCarta:null,
  draftPhoto:undefined,
  tab:'cal',
  view:{y:now.getFullYear(),m:now.getMonth()},
  sheet:null,confirm:null,confirmTodo:null
};

/* ===== Capa de datos: base compartida o, si no hay, este movil ===== */
var chains={};
function setNotice(msg){
  state.notice=msg;renderStatus();
  setTimeout(function(){if(state.notice===msg){state.notice='';renderStatus();}},7000);
}
function onWriteErr(e){
  var c=e&&e.code;
  if(c==='invalid_argument'||c==='permission-denied'){state.readOnly=true;renderStatus();}
  else if(c==='quota_exceeded'){setNotice('La base de datos está llena. Borra algo antiguo.');}
  else{setNotice('No se ha podido guardar. Inténtalo otra vez.');}
}
function dbRun(col,id,fn){
  var k=col+'/'+id;
  chains[k]=(chains[k]||Promise.resolve()).then(fn).catch(onWriteErr);
  return chains[k];
}
function plain(o){var r={},k;for(k in o){if(k!=='id'){r[k]=o[k];}}return r;}
function upsert(list,o){
  for(var i=0;i<list.length;i++){if(list[i].id===o.id){list[i]=o;return;}}
  list.push(o);
}
function cloudSet(col,id,data){dbRun(col,id,function(){return state.db.collection(col).doc(id).set(data);});}
function cloudDel(col,id){dbRun(col,id,function(){return state.db.collection(col).doc(id).delete();});}
function putEvent(o){
  if(state.mode==='cloud'){cloudSet('events',o.id,plain(o));}
  else{upsert(state.events,o);save();}
}
function removeEvent(id){

  else{state.events=state.events.filter(function(e){return e.id!==id;});save();}
}
function putTodo(o){
  if(state.mode==='cloud'){cloudSet('todos',o.id,plain(o));}
  else{upsert(state.todos,o);save();}
}
function removeTodo(id){
  if(state.mode==='cloud'){cloudDel('todos',id);}

}
function putMeta(key,obj){
  if(state.mode==='cloud'){cloudSet('meta',key,obj);return true;}
  if(key==='pareja'){state.names={a:obj.a,b:obj.b};save();return true;}
  if(key==='since'){state.since=obj.date;save();return true;}
  if(key==='foto'){state.photo=obj.data;return savePhoto(obj.data);}
  return true;
}

function eventsOn(y,m0,d){
  return state.events.filter(function(e){
    var p=parse(e.date);
    return p.m===m0&&p.d===d&&(p.y===y||(e.yearly&&y>p.y));
  }).sort(function(a,b){return (a.time||'99').localeCompare(b.time||'99');});
}
function nextOcc(e,from){
  var p=parse(e.date);
  if(!e.yearly){var dt=new Date(p.y,p.m,p.d);return dt>=from?dt:null;}
  var yy=Math.max(from.getFullYear(),p.y);
  var d2=new Date(yy,p.m,p.d);
  if(d2<from){d2=new Date(yy+1,p.m,p.d);}
  return d2;
}
function countdown(n){return n===0?'Hoy':(n===1?'Mañana':'En '+n+' días');}
function isOpen(c){return dateOf(c.fecha)<=todayDate();}
function unreadCount(){return state.cartas.filter(function(c){return !isMine(c)&&canSee(c)&&!state.read[c.id];}).length;}

function renderCountdown(){

    return '<button class="cd '+TYPES[x.e.type].cls+'" data-action="day" data-date="'+ymdOf(x.o)+'">'+
      '<span class="cd-n">'+num+'</span>'+
      '<span class="cd-t"><strong>'+esc(x.e.title)+'</strong><span>'+wdName(x.o)+' '+x.o.getDate()+' de '+MONTHS[x.o.getMonth()]+(x.e.yearly?' · cada año':'')+'</span></span></button>';
  }).join('')+'</div>';
}
function renderMonth(){
  var y=state.view.y,m=state.view.m;
  document.getElementById('mtitle').innerHTML=MONTHS[m]+' <span>'+y+'</span>';
  var lead=(new Date(y,m,1).getDay()+6)%7;
  var dim=new Date(y,m+1,0).getDate();
  var t=todayDate();
  var h='',i,d;
  for(i=0;i<lead;i++){h+='<span></span>';}
  for(d=1;d<=dim;d++){
    var evs=eventsOn(y,m,d);
    var isT=(t.getFullYear()===y&&t.getMonth()===m&&t.getDate()===d);
    var seen={},dots='';
    evs.forEach(function(e){if(TYPES[e.type]&&!seen[e.type]&&Object.keys(seen).length<3){seen[e.type]=1;dots+='<span class="dot '+TYPES[e.type].cls+'"></span>';}});
    var lab=d+' de '+MONTHS[m]+(evs.length?', '+evs.length+(evs.length>1?' cosas apuntadas':' cosa apuntada'):'');
    h+='<button class="day'+(evs.length?' has':'')+(isT?' today':'')+'" data-action="day" data-date="'+ymd(y,m,d)+'" aria-label="'+lab+'"><span class="n">'+d+'</span><span class="dots">'+dots+'</span></button>';

  var from=todayDate();

  state.events.forEach(function(e){if(!TYPES[e.type]){return;}var o=nextOcc(e,from);if(o){list.push({e:e,o:o});}});
  list.sort(function(a,b){return (a.o-b.o)||((a.e.time||'99').localeCompare(b.e.time||'99'));});
  list=list.slice(0,10);
  if(!list.length){
    box.innerHTML='<p class="empty">Todavía no hay nada apuntado. Toca un día del calendario o el botón + para empezar. Lo que apunte cualquiera de los dos aparecerá aquí.</p>';

/* ===== Cartas: solo las edita quien las escribio ===== */
function findCarta(id){return state.cartas.filter(function(c){return c.id===id;})[0];}
function myLetters(){return state.cartas.filter(function(c){return !!state.me&&c.autor===state.me;});}
function isMine(c){return !!state.me&&c.autor===state.me;}
function canSee(c){return isMine(c)||isOpen(c)||(!!c.pinHash&&state.unlocked[c.id]===c.pinHash);}
function authorName(c){return state.authorNames[c.autor]||'tu pareja';}
function hashPin(pin,salt){
  try{
    if(window.crypto&&window.crypto.subtle&&window.TextEncoder){
      return window.crypto.subtle.digest('SHA-256',new TextEncoder().encode('carta:'+salt+':'+pin)).then(function(buf){
        return Array.prototype.map.call(new Uint8Array(buf),function(b){return ('0'+b.toString(16)).slice(-2);}).join('');
      });
    }
  }catch(e){}
  return Promise.resolve('p:'+pin);
}
function stripAutor(l){var o={},k;for(k in l){if(k!=='autor'){o[k]=l[k];}}return o;}
function writeLetters(list){
  var me=state.me;
  if(state.mode!=='cloud'||!me){return;}
  var data={lista:list.map(stripAutor)};
  dbRun('cartas',me,function(){return state.db.collection('cartas').doc(me).set(data);});
}
function setLocalLetters(list){
  var others=state.cartas.filter(function(c){return c.autor!==state.me;});
  state.cartas=others.concat(list.map(function(l){var o=stripAutor(l);o.autor=state.me;return o;}));
}
function saveCarta(){
  var s=state.sheet;
  var err=document.getElementById('ferr');
  var titulo=document.getElementById('f-ct').value.trim();
  var fecha=document.getElementById('f-cf').value;
  var texto=document.getElementById('f-cx').value.trim();
  var pin=document.getElementById('f-cp').value.trim();
  var qEl=document.getElementById('f-cq');
  var quitar=qEl?qEl.checked:false;
  if(!state.me||state.mode!=='cloud'){err.textContent='Hace falta tener la sesión iniciada para escribir cartas.';return;}
  if(!titulo){err.textContent='Ponle un título a la carta.';return;}
  if(!fecha){err.textContent='Elige el día en que se abrirá.';return;}
  if(!texto){err.textContent='Escribe la carta.';return;}
  if(pin&&!/^[0-9]{4}$/.test(pin)){err.textContent='La clave tiene que ser de 4 números.';return;}
  var prev=s.editId?findCarta(s.editId):null;
  if(s.editId&&(!prev||!isMine(prev))){err.textContent='Solo quien escribió la carta puede cambiarla.';return;}
  var id=prev?prev.id:uid();
  function finish(hash){
    var o={id:id,titulo:titulo,fecha:fecha,texto:texto,pinHash:hash||'',creada:(prev&&prev.creada)?prev.creada:ymdOf(todayDate())};
    var list=myLetters().filter(function(l){return l.id!==id;});
    list.push(o);
    if(JSON.stringify(list).length>200000){var e2=document.getElementById('ferr');if(e2){e2.textContent='Hay demasiado texto en tus cartas. Acorta alguna.';}return;}
    setLocalLetters(list);writeLetters(list);
    state.sheet=null;render();
  }
  if(pin){hashPin(pin,id).then(finish);}
  else if(prev&&!quitar){finish(prev.pinHash);}
  else{finish('');}
}
function deleteLetter(id){
  var list=myLetters().filter(function(l){return l.id!==id;});
  setLocalLetters(list);writeLetters(list);
}
function tryEarly(){
  var s=state.sheet;if(!s||s.mode!=='early'){return;}
  var c=findCarta(s.id);
  var err=document.getElementById('ferr');
  var v=document.getElementById('f-pin').value.trim();
  var wait=state.pinTry.until-Date.now();
  if(wait>0){err.textContent='Demasiados intentos. Espera '+Math.ceil(wait/1000)+' segundos.';return;}
  if(!c){state.sheet=null;render();return;}
  if(!/^[0-9]{4}$/.test(v)){err.textContent='La clave son 4 números.';return;}
  hashPin(v,c.id).then(function(h){
    if(c.pinHash&&(h===c.pinHash||('p:'+v)===c.pinHash)){
      state.pinTry={n:0,until:0};
      state.unlocked[c.id]=c.pinHash;saveUnlocked();
      state.read[c.id]=true;saveRead();
      state.sheet={mode:'letter',id:c.id};render();
    }else{
      state.pinTry.n++;
      var e3=document.getElementById('ferr');
      if(state.pinTry.n>=5){state.pinTry={n:0,until:Date.now()+60000};if(e3){e3.textContent='Demasiados intentos. Espera 1 minuto.';}}
      else if(e3){e3.textContent='Clave incorrecta.';}
      var inp=document.getElementById('f-pin');if(inp){inp.value='';inp.focus();}
    }
  });
}
function resolveAuthors(){
  if(!state.user||typeof state.user.profiles!=='function'){return;}
  var ids=[];
  state.cartas.forEach(function(c){if(c.autor!==state.me&&ids.indexOf(c.autor)<0){ids.push(c.autor);}});
  if(!ids.length){return;}
  state.user.profiles(ids).then(function(ps){
    var changed=false;
    ids.forEach(function(id){
      var n=(ps&&ps[id]&&ps[id].name)||'';
      if(n&&state.authorNames[id]!==n){state.authorNames[id]=n;changed=true;}
    });
    if(changed){refresh();}
  });
}

function openDay(date){

function saveEvent(){

    type:s.type,note:document.getElementById('f-note').value.trim(),

  putEvent(obj);
  var p=parse(date);state.view={y:p.y,m:p.m};
  state.sheet={mode:'day',date:date};render();
}
function encodeImg(img,max,q){
  var w=img.naturalWidth,h=img.naturalHeight,r=Math.min(1,max/Math.max(w,h));
  var c=document.createElement('canvas');c.width=Math.max(1,Math.round(w*r));c.height=Math.max(1,Math.round(h*r));
  c.getContext('2d').drawImage(img,0,0,c.width,c.height);
  return c.toDataURL('image/jpeg',q);
}
function fileToDataUrl(file,cb){
  var fr=new FileReader();
  fr.onload=function(){
    var img=new Image();
    img.onload=function(){
      try{
        var url=encodeImg(img,640,0.82);
        if(url.length>200000){url=encodeImg(img,480,0.7);}
        if(url.length>200000){url=encodeImg(img,320,0.6);}
        cb(url);
      }catch(e){cb(null);}
    };
    img.onerror=function(){cb(null);};
    img.src=fr.result;
  };
  fr.onerror=function(){cb(null);};
  fr.readAsDataURL(file);
}

  else if(a==='glass'){look.glass=!look.glass;saveLook();applyLook();t.setAttribute('aria-pressed',String(look.glass));}
  else if(a==='perfil'){state.draftPhoto=undefined;state.sheet={mode:'perfil'};render();}

  else if(a==='save-perfil'){

document.addEventListener('submit',function(ev){
  if(ev.target.id==='early-form'){ev.preventDefault();tryEarly();return;}
  if(ev.target.id==='todo-edit-form'){
    ev.preventDefault();
    var cur2=state.todos.filter(function(x){return x.id===state.sheet.id;})[0];
    var nv=document.getElementById('f-tt').value.trim();
    if(!nv){document.getElementById('ferr').textContent='Escribe algo para el plan.';return;}
    if(cur2){var o2={};for(var k2 in cur2){o2[k2]=cur2[k2];}o2.text=nv;o2.example=false;putTodo(o2);}
    state.sheet=null;render();return;
  }
  if(ev.target.id!=='todo-form'){return;}

});

document.addEventListener('input',function(ev){

var MOON='<svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>';
function sysDark(){return !!(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches);}

/* ===== Cambiar de pestaña deslizando ===== */
var TABS=['cal','lista','cartas'],tabDrag=null;
function setTab(k){
  if(k===state.tab){renderTabs();return;}
  var dir=TABS.indexOf(k)>TABS.indexOf(state.tab)?1:-1;
  document.documentElement.style.setProperty('--dx',String(dir));
  state.tab=k;state.confirmTodo=null;render();
  try{window.scrollTo({top:0,behavior:'smooth'});}catch(e){}
}
(function(){
  var tabs=document.getElementById('tabs'),ind=document.getElementById('ind');
  function pos(ev){
    var r=tabs.getBoundingClientRect(),w=(r.width-10)/3;
    return {f:Math.max(0,Math.min(2,(ev.clientX-r.left-5)/w-0.5)),w:w};
  }
  tabs.addEventListener('pointerdown',function(ev){
    if(ev.button>0){return;}
    tabDrag={x:ev.clientX,moved:false,id:ev.pointerId,lx:ev.clientX,lt:Date.now()};
    pressLens(true,null);
    try{tabs.setPointerCapture(ev.pointerId);}catch(e){}
  });
  tabs.addEventListener('pointermove',function(ev){
    if(!tabDrag){return;}
    if(!tabDrag.moved&&Math.abs(ev.clientX-tabDrag.x)>6){tabDrag.moved=true;tabs.classList.add('drag');}
    if(tabDrag.moved){var nowT=Date.now(),vv=(ev.clientX-tabDrag.lx)/Math.max(1,nowT-tabDrag.lt);tabDrag.lx=ev.clientX;tabDrag.lt=nowT;ind.style.setProperty('--sx',String(1.16+Math.min(.22,Math.abs(vv)*.18)));var p=pos(ev),n=Math.round(p.f);ind.style.setProperty('--p',String(p.f));pressLens(true,p.f);
      document.querySelectorAll('#tabbtns button').forEach(function(bt,i){bt.setAttribute('aria-selected',String(i===n));});}
  });
  function end(ev,cancel){
    if(!tabDrag){return;}
    var p=pos(ev),was=tabDrag;tabDrag=null;
    tabs.classList.remove('drag');pressLens(false);
    try{tabs.releasePointerCapture(was.id);}catch(e){}
    if(cancel){renderTabs();return;}
    setTab(TABS[Math.round(p.f)]);
  }
  tabs.addEventListener('pointerup',function(ev){end(ev,false);});
  tabs.addEventListener('pointercancel',function(ev){end(ev,true);});
})();


/* ===== Cerrar la ventana deslizando hacia abajo ===== */
(function(){
  var sh=document.getElementById('sheet'),sc=document.getElementById('scrim'),d=null;
  function reset(){sh.style.transition='';sh.style.transform='';sc.style.transition='';sc.style.opacity='';}
  sh.addEventListener('touchstart',function(ev){
    if(ev.touches.length!==1){d=null;return;}
    var t=ev.touches[0],r=sh.getBoundingClientRect();
    d={y:t.clientY,t:Date.now(),dy:0,active:false,top:(t.clientY-r.top)<70,form:!!ev.target.closest('input,textarea,select')};
  },{passive:true});
  sh.addEventListener('touchmove',function(ev){
    if(!d){return;}
    var t=ev.touches[0],dy=t.clientY-d.y;
    if(!d.active){
      if(sh.scrollTop>0&&!d.top){d.y=t.clientY;d.t=Date.now();return;}
      if(d.form){return;}
      if(dy>6){d.active=true;sh.style.transition='none';sc.style.transition='none';}
      else{return;}
    }
    ev.preventDefault();
    var y=Math.max(0,dy);d.dy=y;
    sh.style.transform='translateY('+y+'px)';
    sc.style.opacity=String(Math.max(0,1-y/Math.max(320,sh.offsetHeight)));
  },{passive:false});
  function finish(){
    if(!d){return;}
    var x=d;d=null;
    if(!x.active){return;}
    var v=x.dy/Math.max(1,Date.now()-x.t);
    sh.style.transition='transform .3s cubic-bezier(.2,.8,.2,1)';sc.style.transition='opacity .3s ease';
    if(x.dy>110||(v>0.6&&x.dy>40)){
      sh.style.transform='translateY('+(sh.offsetHeight+40)+'px)';sc.style.opacity='0';
      setTimeout(function(){reset();state.sheet=null;state.confirm=null;state.draftPhoto=undefined;render();},290);
    }else{sh.style.transform='';sc.style.opacity='';setTimeout(reset,320);}
  }
  sh.addEventListener('touchend',finish);sh.addEventListener('touchcancel',finish);
})();


/* ===== Si la app se queda abierta, se actualiza al cambiar el dia ===== */
(function(){

})();


/* ===== Pastilla de cristal (como en iOS) y paginas que siguen al dedo ===== */
var pgBusy=false;
function pressLens(on){
  var ind=document.getElementById('ind'),tb=document.getElementById('tabs');
  tb.classList.toggle('press',!!on);
  if(on){ind.style.setProperty('--sx','1.16');ind.style.setProperty('--sy','1.3');}
  else{ind.style.removeProperty('--sx');ind.style.removeProperty('--sy');}
}
(function(){
  var pager=document.getElementById('pager'),ind=document.getElementById('ind'),GAP=24,P={on:false};
  function pan(k){return document.getElementById('p-'+k);}
  function clean(el){if(!el){return;}['position','top','left','width','transform','transition','animation'].forEach(function(k){el.style[k]='';});}
  function markNearest(f){
    var n=Math.max(0,Math.min(2,Math.round(f)));
    document.querySelectorAll('#tabbtns button').forEach(function(bt,i){bt.setAttribute('aria-selected',String(i===n));});
  }
  function setNb(dir){
    if(P.dir===dir){return;}
    if(P.nb){P.nb.hidden=true;clean(P.nb);P.nb=null;}
    P.dir=dir;
    var j=P.idx+dir;
    if(j<0||j>2){return;}
    var nb=pan(TABS[j]);
    nb.hidden=false;nb.style.animation='none';nb.style.position='absolute';nb.style.top='0';nb.style.left='0';nb.style.width='100%';nb.style.transition='none';
    P.nb=nb;
  }
  pager.addEventListener('touchstart',function(ev){
    if(pgBusy||ev.touches.length!==1||state.sheet||ev.target.closest('input,textarea')){P={on:false};return;}
    var t=ev.touches[0];
    P={on:true,x:t.clientX,y:t.clientY,lx:t.clientX,lt:Date.now(),v:0,mode:0,dir:0,nb:null,cx:0};
  },{passive:true});
  pager.addEventListener('touchmove',function(ev){
    if(!P.on){return;}
    var t=ev.touches[0],dx=t.clientX-P.x,dy=t.clientY-P.y;
    if(!P.mode){
      if(Math.abs(dx)<8&&Math.abs(dy)<8){return;}
      if(Math.abs(dx)>Math.abs(dy)*1.3){
        P.mode=1;P.idx=TABS.indexOf(state.tab);P.w=pager.getBoundingClientRect().width;P.cur=pan(state.tab);
        P.cur.style.animation='none';P.cur.style.transition='none';pgBusy=true;
        ind.style.transition='none';
      }else{P.on=false;return;}
    }
    ev.preventDefault();
    var now=Date.now();P.v=(t.clientX-P.lx)/Math.max(1,now-P.lt);P.lx=t.clientX;P.lt=now;
    var dir=dx<0?1:-1,j=P.idx+dir,x=dx;
    setNb(dir);
    if(j<0||j>2){x=dx*0.28;}
    P.cx=x;
    P.cur.style.transform='translateX('+x+'px)';
    if(P.nb){P.nb.style.transform='translateX('+(x+dir*(P.w+GAP))+'px)';}
    var f=Math.max(0,Math.min(2,P.idx-x/(P.w+GAP)));
    ind.style.setProperty('--p',String(f));markNearest(f);
  },{passive:false});
  function end(){
    if(!P.on||P.mode!==1){P={on:false};return;}
    var dir=P.dir,j=P.idx+dir,x=P.cx,w=P.w+GAP;
    var go=(j>=0&&j<=2)&&(Math.abs(x)>P.w*0.28||(Math.abs(P.v)>0.45&&Math.abs(x)>36&&Math.sign(P.v)===-dir));
    var tIdx=go?j:P.idx,cur=P.cur,nb=P.nb;
    var tr='transform .5s cubic-bezier(.32,.72,0,1)';
    cur.style.transition=tr;cur.style.transform='translateX('+(go?-dir*w:0)+'px)';
    if(nb){nb.style.transition=tr;nb.style.transform='translateX('+(go?0:dir*w)+'px)';}
    ind.style.transition='';ind.style.setProperty('--p',String(tIdx));markNearest(tIdx);
    P={on:false};
    setTimeout(function(){
      pager.classList.add('nofade');
      clean(cur);if(nb){clean(nb);}
      if(go){setTab(TABS[tIdx]);}else{if(nb){nb.hidden=true;}renderTabs();}
      pgBusy=false;
      requestAnimationFrame(function(){requestAnimationFrame(function(){pager.classList.remove('nofade');});});
    },520);
  }
  pager.addEventListener('touchend',end);pager.addEventListener('touchcancel',end);
})();

/* ===== Arranque: base compartida si existe, si no este movil ===== */
function startLocal(){
  var saved=load();
  state.events=saved&&saved.events?saved.events:seedEvents();
  state.since=saved&&saved.since?saved.since:'';
  state.todos=saved&&saved.todos?saved.todos:seedTodos();
  state.names=saved&&saved.names?saved.names:{a:PAREJA.a,b:PAREJA.b};
  state.photo=loadPhoto();
  state.mode='local';state.loaded=true;
  if(!saved||!saved.todos){save();}
  render();
}
function docToObj(d){
  var o=d.data()||{},r={},k;
  for(k in o){r[k]=o[k];}
  r.id=d.id;
  return r;
}
function startCloud(db,user){
  state.mode='cloud';state.db=db;state.user=user||null;
  var got={ev:false,td:false,me:false,ca:false};
  if(user&&typeof user.id==='function'){
    user.id().then(function(id){state.me=id||null;state.meKnown=true;resolveAuthors();refresh();})
      .catch(function(){state.meKnown=true;refresh();});
  }else{state.meKnown=true;}
  var timer=setTimeout(function(){state.slow=true;renderStatus();},10000);
  function ready(snap,k){
    got[k]=true;
    if(snap.metadata&&snap.metadata.fromCache===false){clearTimeout(timer);state.slow=false;}
    if(got.ev&&got.td&&got.me&&got.ca){state.loaded=true;}
  }
  function fail(e){
    clearTimeout(timer);
    state.loaded=true;
    state.notice=(e&&e.code==='revoked')?'Se ha cortado el acceso a vuestros datos.':'No puedo leer vuestros datos ahora mismo.';
    refresh();
  }
  db.collection('events').onSnapshot(function(snap){
    state.events=snap.docs.map(docToObj);ready(snap,'ev');refresh();
  },fail);
  db.collection('todos').onSnapshot(function(snap){
    state.todos=snap.docs.map(docToObj);ready(snap,'td');refresh();
  },fail);
  db.collection('meta').onSnapshot(function(snap){
    var names={a:PAREJA.a,b:PAREJA.b},since='',photo=PAREJA.foto||'';
    snap.docs.forEach(function(d){
      var o=d.data()||{};
      if(d.id==='pareja'){names={a:o.a||'',b:o.b||''};}
      else if(d.id==='since'){since=o.date||'';}
      else if(d.id==='foto'){photo=o.data||'';}
    });
    state.names=names;state.since=since;state.photo=photo;
    ready(snap,'me');refresh();
  },fail);
  db.collection('cartas').onSnapshot(function(snap){
    var all=[];
    snap.docs.forEach(function(d){
      var lista=(d.data()||{}).lista||[];
      lista.forEach(function(l){var o={},k;for(k in l){o[k]=l[k];}o.autor=d.id;all.push(o);});
    });
    state.cartas=all;
    ready(snap,'ca');resolveAuthors();refresh();
  },fail);
}
function showLogin(msg){
  var l=document.getElementById('login');l.hidden=false;
  document.getElementById('lerr').textContent=msg||'';
}
function authMsg(e){
  var c=e&&e.code||'';
  if(c.indexOf('invalid-credential')>=0||c.indexOf('wrong-password')>=0||c.indexOf('user-not-found')>=0||c.indexOf('invalid-email')>=0){return 'El correo o la contraseña no son correctos.';}
  if(c.indexOf('too-many-requests')>=0){return 'Demasiados intentos. Espera unos minutos y prueba otra vez.';}
  if(c.indexOf('network')>=0){return 'No hay conexión a internet.';}
  return 'No se ha podido entrar. Inténtalo otra vez.';
}
function makeUser(db,auth){
  return {
    id:function(){return Promise.resolve(auth.currentUser?auth.currentUser.uid:null);},
    profiles:function(ids){
      return Promise.all(ids.map(function(id){return db.collection('perfiles').doc(id).get().then(function(d){return d.exists?d.data():null;}).catch(function(){return null;});}))
        .then(function(arr){var r={};ids.forEach(function(id,n){if(arr[n]){r[id]=arr[n];}});return r;});
    }
  };
}
function boot(){
  var cfg=window.FIREBASE_CONFIG;
  if(!window.firebase||!cfg||!cfg.apiKey||/PEGA/.test(cfg.apiKey)){
    showLogin('Falta pegar la configuración de Firebase en el archivo config.js.');
    document.getElementById('lform').hidden=true;return;
  }
  firebase.initializeApp(cfg);
  var auth=firebase.auth(),db=firebase.firestore();
  window.__auth=auth;
  var started=false;
  auth.onAuthStateChanged(function(u){
    if(!u){started=false;showLogin('');return;}
    document.getElementById('login').hidden=true;
    if(started){return;}
    started=true;
    var email=(u.email||'').split('@')[0];
    var nombre=email?email.charAt(0).toUpperCase()+email.slice(1):'Tu pareja';
    db.collection('perfiles').doc(u.uid).get().then(function(d){
      if(!d.exists){return db.collection('perfiles').doc(u.uid).set({nombre:nombre});}
    }).catch(function(){});
    startCloud(db,makeUser(db,auth));
  });
  document.getElementById('lform').addEventListener('submit',function(ev){
    ev.preventDefault();
    var em=document.getElementById('lemail').value.trim(),pw=document.getElementById('lpass').value;
    if(!em||!pw){document.getElementById('lerr').textContent='Escribe tu correo y tu contraseña.';return;}
    document.getElementById('lerr').textContent='Entrando...';
    auth.signInWithEmailAndPassword(em,pw).catch(function(e){document.getElementById('lerr').textContent=authMsg(e);});
  });
}

render();
boot();
})();
